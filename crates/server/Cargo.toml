[package]
name = "patchouli-server"
description = "Local Patchouli daemon and control CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "patchouli"
path = "src/main.rs"
required-features = ["sqlite"]

[features]
default = ["sqlite"]
sqlite = ["dep:patchouli-provider-sqlite"]

[dependencies]
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
patchouli-backend = { path = "../backend" }
patchouli-provider = { path = "../provider" }
patchouli-provider-remote = { path = "../provider-remote" }
patchouli-provider-router = { path = "../provider-router" }
patchouli-provider-sqlite = { path = "../provider-sqlite", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile = "3"
