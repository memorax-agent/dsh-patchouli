name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project
        run: pnpm check

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust backend
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust backend
        run: cargo test --workspace

  package-daemon:
    name: Package daemon (${{ matrix.artifact }})
    needs: verify
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: target/release/patchouli
            artifact: patchouli-linux-x86_64
            asset: patchouli-linux-x86_64
          - os: macos-latest
            binary: target/release/patchouli
            artifact: patchouli-macos
            asset: patchouli-macos
          - os: windows-latest
            binary: target/release/patchouli.exe
            artifact: patchouli-windows-x86_64
            asset: patchouli-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon
        run: cargo build --release --bin patchouli

      - name: Name release asset
        run: node --eval "const fs=require('node:fs'); fs.mkdirSync('dist'); fs.copyFileSync(process.argv[1], process.argv[2])" "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  release-daemon:
    name: Publish daemon release
    needs: package-daemon
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download daemon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: patchouli-*
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/**/* --generate-notes

  deploy-daemon:
    name: Deploy daemon to local server
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon
        run: cargo build --release --bin patchouli

      - name: Deploy and verify daemon
        env:
          PATCHOULI_DEPLOY_ROOT: ${{ vars.PATCHOULI_DEPLOY_ROOT }}
          PATCHOULI_ENDPOINT: ${{ vars.PATCHOULI_ENDPOINT }}
          PATCHOULI_CONFIG: ${{ vars.PATCHOULI_CONFIG }}
          PATCHOULI_PROVIDERS: ${{ vars.PATCHOULI_PROVIDERS }}
        run: node scripts/deploy-daemon.mjs "${{ runner.os == 'Windows' && 'target/release/patchouli.exe' || 'target/release/patchouli' }}"
