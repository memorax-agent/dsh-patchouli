name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project
        run: pnpm check

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust backend
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust backend
        run: cargo test --locked --workspace

      - name: Check Unix installer syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/install.sh

      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Test Windows staged installation failure
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1

  package-daemon:
    name: Package daemon (${{ matrix.artifact }})
    needs: verify
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/patchouli-db
            artifact: patchouli-db-linux-x86_64
            asset: patchouli-db-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/patchouli-db
            artifact: patchouli-db-linux-aarch64
            asset: patchouli-db-linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/patchouli-db
            artifact: patchouli-db-macos-x86_64
            asset: patchouli-db-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/patchouli-db
            artifact: patchouli-db-macos-aarch64
            asset: patchouli-db-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/patchouli-db.exe
            artifact: patchouli-db-windows-x86_64
            asset: patchouli-db-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/validate-release-tag.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build Linux daemon
        if: runner.os == 'Linux'
        env:
          CC: musl-gcc
        run: cargo build --locked --release --bin patchouli-db --target ${{ matrix.target }}

      - name: Build daemon
        if: runner.os != 'Linux'
        run: cargo build --locked --release --bin patchouli-db --target ${{ matrix.target }}

      - name: Name release asset
        run: node --eval "const fs=require('node:fs'); fs.mkdirSync('dist'); fs.copyFileSync(process.argv[1], process.argv[2])" "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Write release checksum
        run: node --eval "const fs=require('node:fs'); const crypto=require('node:crypto'); const file=process.argv[1]; const name=process.argv[2]; const hash=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'); fs.writeFileSync(file+'.sha256', hash+'  '+name+'\n')" "dist/${{ matrix.asset }}" "${{ matrix.asset }}"

      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release-daemon:
    name: Publish daemon release
    needs: package-daemon
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download daemon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: patchouli-db-*
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/**/* --generate-notes

  deploy-daemon:
    name: Deploy daemon to local server
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon
        run: cargo build --locked --release --bin patchouli-db

      - name: Deploy and verify daemon
        env:
          PATCHOULI_DEPLOY_ROOT: ${{ vars.PATCHOULI_DEPLOY_ROOT }}
          PATCHOULI_ENDPOINT: ${{ vars.PATCHOULI_ENDPOINT }}
          PATCHOULI_CONFIG: ${{ vars.PATCHOULI_CONFIG }}
          PATCHOULI_PROVIDERS: ${{ vars.PATCHOULI_PROVIDERS }}
        run: node scripts/deploy-daemon.mjs "${{ runner.os == 'Windows' && 'target/release/patchouli-db.exe' || 'target/release/patchouli-db' }}"
