[workspace]
members = [
  "crates/backend",
  "crates/provider",
  "crates/provider-sqlite",
  "crates/server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/memorax-agent/dsh-patchouli"

[workspace.dependencies]
async-trait = "0.1"
automerge = "0.11"
autosurgeon = "0.13"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
fs4 = "1.1"
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
