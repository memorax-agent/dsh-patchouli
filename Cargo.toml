[workspace]
members = ["crates/backend"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/memorax-agent/dsh-patchouli"

[workspace.dependencies]
async-trait = "0.1"
futures-core = "0.3"
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
